[project]
name = "retail-data-platform"
version = "0.1.0"
description = "Streaming and batch supermarket data platform: Kafka, PySpark, Delta Lake, Postgres."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "confluent-kafka>=2.6",
    "delta-spark>=4.0.1,<4.1",
    "duckdb>=1.3",
    "fastapi>=0.115",
    "fastembed>=0.5",
    "httpx>=0.27",
    "pgvector>=0.3",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pyspark>=4.0.1,<4.1",
    "streamlit>=1.45",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/retail"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # Raised inside fastapi.testclient by starlette, not by this project.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
markers = [
    "spark: starts a local Spark session (slow); skip with -m 'not spark'",
    "postgres: needs the docker Postgres (make up); uses a throwaway database",
    "model: loads the embedding model (downloaded once into data/models)",
]
