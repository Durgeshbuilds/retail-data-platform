[project]
name = "retail-data-platform"
version = "0.1.0"
description = "Streaming and batch supermarket data platform: Kafka, PySpark, Delta Lake, Postgres."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "confluent-kafka>=2.6",
    "delta-spark>=4.0.1,<4.1",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pyspark>=4.0.1,<4.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/retail"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["spark: starts a local Spark session (slow); skip with -m 'not spark'"]
